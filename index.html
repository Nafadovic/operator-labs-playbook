<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Operator Labs | Live Calling Playbook</title><style>
:root{--teal:#2d8f8e;--deep:#155e60;--light:#e7f4f2;--ink:#163536}*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,Segoe UI,Arial,sans-serif;background:#2d8f8e;color:var(--ink)}header{background:#17686a;color:white;padding:15px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px}header h1{font-size:20px;margin:0}header small{opacity:.85}.shell{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(280px,.85fr);gap:16px;padding:16px;max-width:1700px;margin:auto;height:calc(100vh - 72px)}main,aside{background:#f5fbfa;border-radius:15px;min-height:0;overflow:auto;box-shadow:0 6px 22px #103f4033}main{padding:20px 24px}aside{padding:16px;display:flex;flex-direction:column;overflow:hidden}.tabs{display:flex;gap:8px;position:sticky;top:-20px;background:#f5fbfa;padding:12px 0;z-index:2}button{cursor:pointer;border:1px solid #a8d4d0;border-radius:9px;background:white;color:#20595a;padding:8px 12px;font-weight:650}button:hover{background:#e2f3f1}.tabs button.active,.ob.active{background:#176f70;color:white;border-color:#176f70}h2{font-size:21px;margin:14px 0}h3{font-size:16px;margin:0 0 10px;color:#17686a}.section{background:white;border:1px solid #d0e7e4;border-radius:12px;padding:16px;margin:13px 0}.line{margin:9px 0;white-space:pre-wrap}.line:has(+ .line){margin-bottom:10px}.section .line:nth-child(odd){color:#244849}.meta{color:#5b7777;font-size:13px}.objlist{display:flex;flex-wrap:wrap;gap:6px;overflow:auto;align-content:flex-start;min-height:0;max-height:44%;padding:3px 0 12px}.ob{font-size:12px;padding:6px 9px;text-align:left}.rebuttal{background:white;border:1px solid #b8dad6;border-radius:12px;padding:15px;overflow:auto;flex:1;min-height:120px}.rebuttal p{margin:9px 0}.search{padding:10px;border:1px solid #b9d6d2;border-radius:9px;width:100%;margin:0 0 10px;font:inherit}.asidehead{display:flex;justify-content:space-between;align-items:center;gap:8px}.copy{font-size:12px} .pill{font-size:12px;color:#17686a;background:#def0ed;border-radius:20px;padding:3px 8px} @media(max-width:850px){.shell{display:flex;flex-direction:column;height:auto}main,aside{overflow:visible}aside{min-height:480px}.objlist{max-height:230px}.rebuttal{min-height:180px}header{flex-wrap:wrap}}@media print{body{background:white}header,.tabs,aside{display:none}.shell{display:block;height:auto}main{box-shadow:none;overflow:visible}}
</style></head><body><header><div><h1>OPERATOR LABS · Live Calling Playbook</h1><small>Estate agency lead recovery · Two script versions</small></div><span class="pill">Teal Edition</span></header><div class="shell"><main><div class="tabs"><button id="fullBtn" onclick="switchVersion('full')">Original</button><button id="shortBtn" onclick="switchVersion('short')">Alternative</button><button id="voiceBtn" onclick="showVoicemail()">Voicemail</button></div><h2 id="versionTitle">Choose a script to begin</h2><div class="meta" id="description">Select Original, Alternative, or Voicemail above to display the script.</div><div id="script"></div></main><aside><div class="asidehead"><h3>Quick Objection Rebuttals</h3><span class="pill" id="count"></span></div><input class="search" id="search" placeholder="Search objections…" aria-label="Search objections"><div class="objlist" id="objlist"></div><div class="rebuttal" id="rebuttal"><h3>Choose an objection</h3><p>Select a button above to see the response here.</p></div></aside></div><script>
const DATA={"full": [{"title": "1. Gatekeeper Handling", "lines": ["Caller: \"Hi, could you put me through to [Decision-Maker's Name], please?\"", "If asked who is calling:", "\"It's [Caller Name] from Operator Labs.\"", "If asked what the call is about:", "\"It's regarding how your branch follows up on previous property enquiries from Rightmove, Zoopla, and other lead-generation channels. Just put me through to [Name], please?\"", "If asked for more details:", "\"We help estate agents recover opportunities from older enquiries and leads generated through portals, paid advertising, and other channels that may not have converted at the time. [Name] would be the best person to speak to about that. Isn’t it?\"", "If told the decision-maker is busy:", "\"No problem. When would be the best time to reach them?\"", "If asked to send an email:", "\"Of course. What's the best email address for [Name]? I'll send over a brief introduction.\"", "If told the decision-maker is not responsible:", "\"Thanks for clarifying. Who oversees lead generation, valuation appointments, or follow-up on older property enquiries?\""]}, {"title": "2. Opening the Call", "lines": ["Caller:", "\"Hi [Name], it's [Caller Name], how is everything going?\"", "So [Caller Name] We work with estate firms to recover opportunities from older property enquiries coming through Rightmove, Zoopla, paid ads, and other lead-generation channels. With no set up, retainer or any kind of upfront payments.", "A lot of enquiries don't convert immediately, so estate firms can end up spending money generating leads that never turn into instructions.\""]}, {"title": "3. Discovery Questions", "lines": ["Ask naturally, based on the prospect's responses.", "Question 1:", "\"Do you generate many valuation enquiries through Rightmove, Zoopla, your website, or paid advertising?\"", "Question 2:", "\"When those enquiries don't convert straight away, what normally happens to them?\"", "Question 3:", "\"Do you have a process for going back to older leads, or does the team mainly focus on new enquiries?\"", "Question 4:", "\"Have you ever revisited older enquiries and found people who were ready to sell later on?\"", "Question 5:", "\"Roughly how much time does your team spend following up leads that initially go cold?\"", "Question 6:", "\"If you could recover positive leads from enquiries you've already paid to generate, without adding more manual work for your team, would that be worth exploring?\""]}, {"title": "4. Explaining the Solution", "lines": ["\"That's exactly the kind of opportunity we help with.", "At Operator Labs, we help estate agents re-engage older enquiries from sources such as Rightmove, Zoopla, website enquiries, and paid advertising.", "Instead of letting those leads sit in the CRM after the initial enquiry goes cold, we use SMS conversations to reconnect with them, identify people who may now be considering selling, and arrange valuation appointments for the team.", "The idea is to recover opportunities from the leads you've already generated, rather than continually spending more on new enquiries while older ones remain untouched.\""]}, {"title": "5. Explaining the Commercial Model", "lines": ["\"Another important point is that we don't charge a monthly retainer or a setup fee as mentioned. You pay for the positive leads we generate, according to the criteria agreed with you beforehand.", "That means you aren't committing to a recurring retainer just to get started. We agree on what qualifies as a positive lead, how it's delivered, and the commercial terms before moving forward.\"", "If asked what qualifies as a positive lead:", "\"That's something we'd define together before starting, so we're aligned on the criteria and what you're paying for. So would (Date) and (Time) works to set this up and have a further discussion?\""]}, {"title": "6. Booking the Meeting", "lines": ["We will look at your current follow-up process, explain how we work, and establish whether the commercial model makes sense for your branch.", "Propose (Date) and (Time)", "If they agree:", "\"Perfect. I've got you down for [Day] at [Time]. What's the best email address for the invitation? Or may I confirm your email address, is it prospect@company.com?\"", "\"Brilliant, [Name]. I'll send that over. Thanks for your time.\""]}, {"title": "Voicemail Script", "lines": ["\"Hi [Name], it's [Caller Name].", "We help estate agents reconnect with older enquiries from Rightmove, Zoopla, paid advertising, and other lead-generation channels to identify potential sellers who may now be ready to move forward.", "We work on a pay-per-positive-lead model, with no monthly retainer or setup fee, based on agreed criteria.", "I'd be happy to explain how it works and see whether it could be relevant to your branch. You can reach me on [Phone Number].", "Thanks, [Name].\""]}, {"title": "Caller Reminders", "lines": ["Keep the gatekeeper conversation short and use the decision-maker's name.", "Mention Rightmove, Zoopla, paid advertising, and other relevant lead sources naturally.", "Focus on recovering opportunities from existing leads, not replacing the prospect's current channels.", "Clearly explain that there is no monthly retainer or setup fee and that payment is based on positive leads under agreed criteria.", "Never promise guaranteed sales or conversion rates.", "Never claim a lead qualifies as positive unless it meets the agreed definition.", "Explain data-protection procedures accurately.", "Respect a clear refusal and record the call outcome.", "The objective of every call is simple: reach the decision-maker, establish relevance, identify an opportunity, explain the model, and book a meeting."]}], "short": [{"title": "1. Gatekeeper", "lines": ["“Hi, could you put me through to [Decision-Maker’s Name], please?”", "If asked: “It’s [Your Name] from Operator Labs. It’s about following up older property enquiries.”", "If unavailable: “No worries. When’s the best time to catch them?”"]}, {"title": "2. Opening", "lines": ["“Hi [Name], it’s [Your Name] from Operator Labs. Have I caught you at an okay time?”", "“We help estate agents reconnect with older enquiries from Rightmove, Zoopla and other channels — the people who showed interest but weren’t ready to move forward at the time.”"]}, {"title": "3. Discover the Gap", "lines": ["“Can I ask, what usually happens to enquiries that don’t convert straight away?”", "“Does someone revisit those older leads, or is your team mostly focused on new enquiries?”", "“Have you had past enquiries come back months later, ready for a valuation?”"]}, {"title": "4. Explain the Offer", "lines": ["“That’s where we may be able to help. We use SMS conversations to re-engage older enquiries, identify people who might now be considering selling, and arrange valuation opportunities for your team.”", "“There’s no setup fee or monthly retainer under our proposed model. You pay for positive leads that meet criteria we agree together beforehand.”"]}, {"title": "5. Book the Meeting", "lines": ["“Would it be worth a quick conversation to see whether this could work for your branch?”", "“I have [Day] at [Time] or [Alternative Day] at [Time]. Which suits you better?”", "“Perfect. What’s the best email for the invitation?”"]}, {"title": "6. Close", "lines": ["“Brilliant, [Name]. I’ll send the invitation over. We’ll walk through your current process, the qualification criteria and the commercial terms. Thanks for your time.”"]}, {"title": "Voicemail", "lines": ["“Hi [Name], it’s [Your Name] from Operator Labs. We help estate agents reconnect with older property enquiries and identify potential valuation opportunities, without a setup fee or monthly retainer under our proposed model. If it’s relevant to your branch, give me a call on [Phone Number]. Thanks.”"]}], "objections": [{"title": "Send me an email.", "lines": ["\"Of course. Just so I make it relevant, are you mainly interested in generating more new enquiries, or would recovering opportunities from older Rightmove, Zoopla, and advertising leads also be useful?\""]}, {"title": "We already follow up all our leads.", "lines": ["\"That's good to hear. Do you also revisit older enquiries that didn't convert initially, or is the team mainly focused on new leads coming in?\""]}, {"title": "We already have a CRM and automation.", "lines": ["\"Absolutely, and we're not looking to replace your system. We focus on reconnecting with older enquiries that may no longer be receiving active attention. Is that already fully covered by your current setup?\""]}, {"title": "We already use Rightmove and Zoopla.", "lines": ["\"Of course. Those platforms can be important sources of enquiries. We're not looking to replace them; we're looking at whether more value can be recovered from the enquiries you've already generated through those channels.\""]}, {"title": "We spend a lot on advertising already.", "lines": ["\"That makes sense. That's actually why lead recovery can be worth exploring. When you're already investing in paid advertising, it may be useful to revisit enquiries that didn't convert the first time rather than relying entirely on additional advertising spend.\""]}, {"title": "Our leads are poor quality.", "lines": ["\"Understood. Is the main issue that the enquiries aren't suitable from the start, or that people express interest but aren't ready to sell at the time?\"", "If they are not ready initially:", "\"That may be an opportunity to revisit the right enquiries later, when their circumstances have changed.\""]}, {"title": "We don't have many old leads.", "lines": ["\"Understood. Roughly how far back does your database go? If the volume is too small, it may not be worth pursuing, but we can assess that before recommending anything.\""]}, {"title": "Our database is already being worked.", "lines": ["\"Good to hear. Does that include older enquiries from a year or two ago, or is the team mainly focused on recent leads?\""]}, {"title": "We get plenty of valuations already.", "lines": ["\"That's a good position to be in. The question is whether you could generate additional opportunities from your existing database without taking time away from your current pipeline. Would that be worth exploring?\""]}, {"title": "We tried this before, and it didn't work.", "lines": ["\"That's fair. Do you mind me asking what didn't work: the response rate, the quality of the leads, or the cost compared with the results?\"", "\"That helps me understand. Before starting anything, we'd agree on the positive-lead criteria and commercial terms so expectations are clear.\""]}, {"title": "We already use another company.", "lines": ["\"Understood. If you're happy with the results, there may not be a reason to change. If there are gaps in the process or older leads aren't being covered, we could explore whether there's an opportunity to help.\""]}, {"title": "How much does it cost?", "lines": ["\"We don't charge a monthly retainer or a setup fee. You pay for the positive leads we generate, based on the agreed criteria. I'd be happy to explain the commercial terms and what qualifies as a positive lead.\""]}, {"title": "So there's no upfront fee?", "lines": ["\"Correct, there's no retainer or setup fee under our proposed model. Payment is based on positive leads that meet the agreed criteria. I'd explain the exact terms before we start.\""]}, {"title": "How do you define a positive lead?", "lines": ["\"We agree on the criteria with you before starting, so we're clear about what qualifies and what you're paying for. That's one of the things we'd cover in the introductory meeting.\""]}, {"title": "How can you guarantee the quality?", "lines": ["\"The important thing is to define the qualification criteria upfront and make sure the leads we deliver meet those requirements. We can explain our process and how the criteria work before you decide.\""]}, {"title": "Our leads are too old to be useful.", "lines": ["\"Some may be, certainly. But people's circumstances can change. Have you tested whether any of those previous enquiries are now considering selling?\""]}, {"title": "We don't want to annoy previous enquiries.", "lines": ["\"Completely understandable. The approach should be relevant and respectful, not repeated messages for the sake of it. We'd need to make sure the contact process is appropriate and that opt-outs are handled correctly.\""]}, {"title": "We're too busy.", "lines": ["\"I understand. The idea is to help recover opportunities without asking your team to manually work through every old enquiry. Would a short conversation at a more convenient time make sense?\""]}, {"title": "We handle everything in-house.", "lines": ["\"Absolutely. Your team knows your market best. We may be able to help with older enquiries that don't receive regular attention because of day-to-day priorities. Is that segment already fully covered?\""]}, {"title": "We don't share our database with third parties.", "lines": ["\"I understand. Data access and control are important. We can explain the proposed workflow and responsibilities so you can assess the arrangement against your internal policies before making a decision.\""]}, {"title": "Is this GDPR compliant?", "lines": ["\"That's an important question. The contact process and handling of personal data need to be appropriate for the circumstances. We can explain our actual procedures and responsibilities so you can assess them before proceeding.\""]}, {"title": "What's the catch?", "lines": ["\"The model is designed to align payment with the positive leads we generate, rather than charging a monthly retainer or setup fee. The agreed qualification criteria and commercial terms will be clear before we start.\""]}, {"title": "I need to think about it.", "lines": ["\"Of course. Is there anything specific you're unsure about, or would you simply prefer some time to consider it?\"", "If they need time:", "\"No problem. Would it help if I sent a brief summary and followed up at a time that suits you?\""]}, {"title": "Call me another time.", "lines": ["\"Certainly. Is there a particular day or time that's usually better for you?\""]}, {"title": "I'm not interested.", "lines": ["\"Understood. Just so I don't waste your time, is it because you've already got your lead follow-up covered, or is recovering older enquiries simply not a priority?\"", "If they remain uninterested:", "\"No problem at all. Thanks for your time, and have a good day.\""]}, {"title": "I'm not the decision-maker.", "lines": ["\"No problem. Who normally oversees lead generation, valuation appointments, or the follow-up of older property enquiries?\"", "If they provide a name:", "\"Perfect, thank you. Would you mind putting me through to [Name]?\""]}]};let version=null,selected=-1;
function safe(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function setActive(which){document.getElementById('fullBtn').classList.toggle('active',which==='full');document.getElementById('shortBtn').classList.toggle('active',which==='short');document.getElementById('voiceBtn').classList.toggle('active',which==='voice')}
function renderSections(sections){document.getElementById('script').innerHTML=sections.map(s=>'<section class="section"><h3>'+safe(s.title)+'</h3>'+s.lines.map(l=>'<p class="line">'+safe(l)+'</p>').join('')+'</section>').join('');document.querySelector('main').scrollTop=0}
function switchVersion(v){version=v;setActive(v);document.getElementById('versionTitle').textContent=v==='full'?'Original calling playbook':'Natural & professional — shorter version';document.getElementById('description').textContent=v==='full'?'Original document wording, arranged for live calling.':'Conversational adaptation: same offer, fewer words and clearer transitions.';renderSections(DATA[v].filter(s=>!s.title.toLowerCase().includes('voicemail')))}
function showVoicemail(){version='voice';setActive('voice');document.getElementById('versionTitle').textContent='Voicemail scripts';document.getElementById('description').textContent='Choose the original wording or the shorter alternative when leaving a message.';const a=DATA.full.find(s=>s.title.toLowerCase().includes('voicemail'));const b=DATA.short.find(s=>s.title.toLowerCase().includes('voicemail'));renderSections([{title:'Original voicemail',lines:a.lines},{title:'Shorter voicemail',lines:b.lines}])}
const priority=["I'm not interested.","What's the catch?","We don't share our database with third parties.","We handle everything in-house.","How much does it cost?","Call me another time."];
DATA.objections.sort((a,b)=>{const ai=priority.indexOf(a.title),bi=priority.indexOf(b.title);return (ai<0?999:ai)-(bi<0?999:bi)});
function renderObj(){const q=document.getElementById('search').value.toLowerCase();const box=document.getElementById('objlist');box.innerHTML='';let n=0;DATA.objections.forEach((o,i)=>{if(!(o.title+' '+o.lines.join(' ')).toLowerCase().includes(q))return;n++;const b=document.createElement('button');b.className='ob'+(selected===i?' active':'');b.textContent=o.title;b.onclick=()=>selectObj(i);box.appendChild(b)});document.getElementById('count').textContent=n+' objections'}
function selectObj(i){selected=i;const o=DATA.objections[i];document.getElementById('rebuttal').innerHTML='<h3>'+safe(o.title)+'</h3>'+o.lines.map(s=>'<p>'+safe(s)+'</p>').join('');renderObj()}
document.getElementById('search').addEventListener('input',renderObj);renderObj();
</script></body></html>
